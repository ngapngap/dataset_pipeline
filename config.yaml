# ================================================================================
# 📋 DATASET PIPELINE CONFIGURATION
# ================================================================================
# File cấu hình cho pipeline tạo dataset Q&A từ văn bản pháp luật
# Hỗ trợ: Gemini, OpenAI, Anthropic, và các provider khác
# ================================================================================

# ------------------------------------------------------------------------------
# 🔧 CẤU HÌNH CHUNG
# ------------------------------------------------------------------------------
general:
  project_name: "bhxh-qa-vietnamese"
  description: "Dataset Q&A về Bảo hiểm xã hội Việt Nam"
  language: "vi"
  
  # Đường dẫn
  input_dir: "../Luat"                    # Thư mục chứa văn bản nguồn
  output_dir: "./output"                  # Thư mục output
  
  # Logging
  log_level: "INFO"                       # DEBUG, INFO, WARNING, ERROR
  log_file: "./logs/pipeline.log"

# ------------------------------------------------------------------------------
# 🤖 CẤU HÌNH LLM PROVIDER
# ------------------------------------------------------------------------------
llm:
  # Provider chính: gemini, openai, anthropic, groq, together, ollama, custom
  provider: "megallm"
  
  # Cấu hình cho từng provider
  providers:
    gemini:
      model: "gemini-2.0-flash"
      api_keys_file: "../gemini_keys.txt"
      max_output_tokens: 3000
      temperature: 0.7
      top_p: 0.9
      rate_limit_per_minute: 60
      
    openai:
      model: "gpt-4o-mini"
      api_keys_file: "../openai_keys.txt"
      max_tokens: 3000
      temperature: 0.7
      top_p: 0.9
      rate_limit_per_minute: 500
      
    anthropic:
      model: "claude-3-haiku-20240307"
      api_keys_file: "./anthropic_keys.txt"
      max_tokens: 3000
      temperature: 0.7
      rate_limit_per_minute: 60
      
    groq:
      model: "llama-3.1-70b-versatile"
      api_keys_file: "./groq_keys.txt"
      max_tokens: 3000
      temperature: 0.7
      rate_limit_per_minute: 30
      
    together:
      model: "meta-llama/Llama-3-70b-chat-hf"
      api_keys_file: "./together_keys.txt"
      max_tokens: 3000
      temperature: 0.7
      rate_limit_per_minute: 60
    
    # ========== CUSTOM LLM PROVIDERS ==========
    # Hỗ trợ bất kỳ API endpoint tương thích OpenAI
    # Có thể dùng api_key (1 key) hoặc api_keys_file (nhiều keys)
    
    # Ollama (local)
    ollama:
      base_url: "http://localhost:11434/v1"
      model: "llama3.2"                   # hoặc qwen2.5, mistral, etc.
      api_key: "ollama"                   # Local không cần key thật
      # api_keys_file: "./ollama_keys.txt"  # Hoặc dùng file nếu có nhiều instances
      max_tokens: 3000
      temperature: 0.7
      
    # LM Studio (local)
    lmstudio:
      base_url: "http://localhost:1234/v1"
      model: "local-model"
      api_key: "lm-studio"
      max_tokens: 3000
      temperature: 0.7
      
    # vLLM (local hoặc server)
    megallm:
      base_url: "https://ai.megallm.io/v1"
      model: "deepseek-ai/deepseek-v3.1"
      api_key: "vllm"
      api_keys_file: "../megallm_keys.txt"  # File chứa API keys
      max_tokens: 3000
      temperature: 0.7
      
    # DeepSeek
    deepseek:
      base_url: "https://api.deepseek.com/v1"
      model: "deepseek-chat"
      api_keys_file: "./deepseek_keys.txt"  # Dùng file cho nhiều keys
      # api_key: "sk-xxx"                   # Hoặc 1 key inline
      max_tokens: 3000
      temperature: 0.7
      
    # OpenRouter (truy cập nhiều model)
    openrouter:
      base_url: "https://openrouter.ai/api/v1"
      model: "meta-llama/llama-3.1-70b-instruct"
      api_keys_file: "./openrouter_keys.txt"
      max_tokens: 3000
      temperature: 0.7
      
    # Fireworks AI
    fireworks:
      base_url: "https://api.fireworks.ai/inference/v1"
      model: "accounts/fireworks/models/llama-v3p1-70b-instruct"
      api_keys_file: "./fireworks_keys.txt"
      max_tokens: 3000
      temperature: 0.7
      
    # Groq (có base_url riêng)
    groq_custom:
      base_url: "https://api.groq.com/openai/v1"
      model: "llama-3.1-70b-versatile"
      api_keys_file: "./groq_keys.txt"
      max_tokens: 3000
      temperature: 0.7
    
    # Custom endpoint (tự định nghĩa)
    custom:
      base_url: "http://your-server:8000/v1"  # Đổi URL của bạn
      model: "your-model-name"
      api_keys_file: "./custom_keys.txt"      # File chứa API keys
      # api_key: "your-api-key"               # Hoặc 1 key inline
      max_tokens: 3000
      temperature: 0.7

# ------------------------------------------------------------------------------
# ⚙️ CẤU HÌNH XỬ LÝ
# ------------------------------------------------------------------------------
processing:
  # Đa luồng - mỗi API key = 1 thread
  threads_per_key: 1                      # Số thread cho mỗi API key
  max_threads: 20                         # Giới hạn tổng số threads
  
  # Chunk settings
  chunk_size: 4000                        # Kích thước chunk (characters)
  chunk_overlap: 200                      # Overlap giữa các chunks
  
  # Retry settings
  max_retries: 5                          # Số lần retry khi lỗi
  retry_delay: 2                          # Delay giữa các retry (seconds)
  
  # Rate limiting
  requests_per_minute: 60                 # Giới hạn requests/phút
  
  # Checkpoint - lưu tiến độ để resume
  checkpoint_enabled: true
  checkpoint_interval: 50                 # Lưu checkpoint mỗi N tasks
  
  # Cache - tránh gọi lại API cho chunks đã xử lý
  cache:
    enabled: true                         # Bật/tắt cache
    cache_dir: "./cache"                  # Thư mục lưu cache
    ttl_days: 30                          # Xóa cache sau N ngày

# ------------------------------------------------------------------------------
# 📝 CẤU HÌNH SINH Q&A
# ------------------------------------------------------------------------------
qa_generation:
  # Số Q&A mỗi chunk
  qa_per_chunk: 5
      
  # Prompt template đơn giản (không dùng perspectives)
  prompt_template: |
    Bạn là chuyên viên tư vấn pháp luật BHXH Việt Nam.

    ⚠️ QUY TẮC BẮT BUỘC:
    1. Câu hỏi phải như NGƯỜI DÂN THẬT hỏi:
       ✅ "Tôi đóng BHXH bao nhiêu năm thì được hưởng lương hưu?"
       ✅ "Mức đóng BHXH hàng tháng của tôi là bao nhiêu phần trăm?"
       ❌ "Luật này quy định về nội dung gì?" (quá chung chung)

    2. Câu trả lời PHẢI:
       - Trích dẫn đầy đủ: "Căn cứ Điều X, Khoản Y..."
       - Có số liệu cụ thể: %, VNĐ, năm/tháng
       - Giải thích dễ hiểu cho người dân

    3. CHỈ tạo Q&A nếu văn bản có thông tin CỤ THỂ
       - Nếu chỉ là định nghĩa chung → trả về []

    NỘI DUNG VĂN BẢN:
    {content}

    Tạo {num_qa} cặp hỏi-đáp CHẤT LƯỢNG CAO.

    Trả về JSON array:
    [
      {{"question": "câu hỏi cụ thể", "answer": "trả lời có trích dẫn đầy đủ"}}
    ]

    JSON:

# ------------------------------------------------------------------------------
# ✅ CẤU HÌNH ĐÁNH GIÁ CHẤT LƯỢNG
# ------------------------------------------------------------------------------
quality:
  # Bật/tắt đánh giá
  enabled: true
  
  # Điểm tối thiểu (1-5) để giữ Q&A
  min_score: 3
  
  # Các tiêu chí đánh giá
  criteria:
    - name: "has_legal_citation"
      weight: 2
      description: "Có trích dẫn văn bản pháp luật"
      patterns:
        - "Luật\\s+[\\wÀ-ỹ]+"
        - "Nghị định\\s+\\d+"
        - "Thông tư\\s+\\d+"
        - "Điều\\s+\\d+"
        - "Khoản\\s+\\d+"
        
    - name: "has_numbers"
      weight: 1
      description: "Có số liệu cụ thể"
      patterns:
        - "\\d+%"
        - "\\d+\\s*(năm|tháng|ngày)"
        - "\\d+[.,]?\\d*\\s*(VNĐ|đồng|triệu|tỷ)"
        
    - name: "min_length"
      weight: 1
      description: "Độ dài tối thiểu"
      min_chars: 100
      
  # Dùng LLM để đánh giá (tốn thêm API)
  use_llm_evaluation: false

# ------------------------------------------------------------------------------
# 📊 CẤU HÌNH OUTPUT
# ------------------------------------------------------------------------------
output:
  # Format output
  formats:
    - "json"                              # JSON file
    - "jsonl"                             # JSON Lines
    
  # Cấu trúc output
  structure:
    instruction_field: "instruction"
    input_field: "input"
    output_field: "output"
    metadata_fields:
      - "source"
      - "perspective"
      - "created_at"
      
  # Deduplicate
  deduplicate:
    enabled: true
    similarity_threshold: 0.9             # Ngưỡng tương đồng (0-1)

